version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types must match the Node runtime major (24, see .nvmrc).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint 8 supports TypeScript <6.1 only; lift when it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
